<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Säljräknare</title>
<style>body{background:#ffffff;color:#000;font-family:Arial,sans-serif;text-align:center;padding:15px;margin:0}h1{margin-bottom:20px}.card{border:1px solid #ddd;border-radius:12px;padding:15px;margin:15px auto;max-width:500px}.siffra{font-size:60px;font-weight:bold;margin:15px 0}button{font-size:22px;padding:12px 18px;margin:5px;border:none;border-radius:10px;cursor:pointer}.plus{background:#22c55e;color:white}.minus{background:#f59e0b;color:white}.spara{background:#2563eb;color:white;width:90%}.reset{background:#ef4444;color:white;width:90%}.radera{background:#dc2626;color:white;padding:8px 12px;font-size:16px}input[type=date]{width:90%;padding:10px;font-size:18px}.runda{border:1px solid #ccc;background:#f8f8f8;border-radius:10px;padding:10px;margin-top:10px;text-align:left}</style>
</head>
<body>
<h1>Säljräknare</h1>
<div class="card"><h3>Datum för säljrunda</h3><input type="date" id="datum"></div>
<div class="card"><h2>Frågade</h2><div id="fragade" class="siffra">0</div><button class="minus" onclick="minusFragade()">−</button><button class="plus" onclick="plusFragade()">+</button></div>
<div class="card"><h2>Signerade</h2><div id="signerade" class="siffra">0</div><button class="minus" onclick="minusSignerade()">−</button><button class="plus" onclick="plusSignerade()">+</button></div>
<div class="card"><h2>Konvertering</h2><div id="konvertering" class="siffra">0%</div></div>
<button class="spara" onclick="sparaRunda()">💾 Spara säljrunda</button><br><br>
<button class="reset" onclick="aterstall()">🔄 Återställ aktuell runda</button>
<div id="historik"></div>
<script>
let fragade=parseInt(localStorage.getItem('fragade'))||0;let signerade=parseInt(localStorage.getItem('signerade'))||0;let rundor=JSON.parse(localStorage.getItem('rundor'))||[];document.getElementById('datum').value=new Date().toISOString().split('T')[0];function sparaData(){localStorage.setItem('fragade',fragade);localStorage.setItem('signerade',signerade)}function uppdatera(){document.getElementById('fragade').innerHTML=fragade;document.getElementById('signerade').innerHTML=signerade;let procent=0;if(fragade>0){procent=((signerade/fragade)*100).toFixed(1)}document.getElementById('konvertering').innerHTML=procent+'%';sparaData()}function plusFragade(){fragade++;uppdatera()}function minusFragade(){if(fragade>0){fragade--;uppdatera()}}function plusSignerade(){signerade++;uppdatera()}function minusSignerade(){if(signerade>0){signerade--;uppdatera()}}function sparaRunda(){let datum=document.getElementById('datum').value;if(!datum){datum=new Date().toISOString().split('T')[0]}let procent=0;if(fragade>0){procent=((signerade/fragade)*100).toFixed(1)}rundor.unshift({datum:datum,fragade:fragade,signerade:signerade,konvertering:procent});localStorage.setItem('rundor',JSON.stringify(rundor));visaHistorik();fragade=0;signerade=0;uppdatera();alert('Säljrunda sparad!')}function raderaRunda(index){if(confirm('Radera denna säljrunda?')){rundor.splice(index,1);localStorage.setItem('rundor',JSON.stringify(rundor));visaHistorik()}}function raderaAllaRundor(){if(confirm('Radera ALLA sparade rundor?')){rundor=[];localStorage.removeItem('rundor');visaHistorik()}}function visaHistorik(){let html=`<div class="card"><h2>Tidigare säljrundor</h2><button class="reset" onclick="raderaAllaRundor()">🗑️ Radera alla rundor</button>`;rundor.forEach(function(runda,index){html+=`<div class="runda"><strong>${runda.datum}</strong><br><br>Frågade: ${runda.fragade}<br>Signerade: ${runda.signerade}<br>Konvertering: ${runda.konvertering}%<br><br><button class="radera" onclick="raderaRunda(${index})">🗑️ Radera</button></div>`});html+=`</div>`;document.getElementById('historik').innerHTML=html}function aterstall(){if(confirm('Nollställa aktuell runda?')){fragade=0;signerade=0;uppdatera()}}uppdatera();visaHistorik();
</script>
</body>
</html>
