<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Säljdashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --bg2:#1e293b;

    --card:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.12);

    --text:#f8fafc;
    --muted:#94a3b8;

    --green:#22c55e;
    --orange:#f59e0b;
    --blue:#3b82f6;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:'Inter',sans-serif;
    color:var(--text);

    background:
    linear-gradient(135deg,#0f172a,#1e293b);

    text-align:center;
}

h1{
    margin:15px 0 5px;
    font-size:34px;
    font-weight:800;
}

.sub{
    color:var(--muted);
    margin-bottom:20px;
}

.card{
    max-width:600px;
    margin:15px auto;

    padding:20px;

    border-radius:24px;

    background:var(--card);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid var(--border);

    box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

h2,h3{
    margin-top:0;
}

h3{
    color:var(--muted);
}

input[type=date],
input[type=text],
input[type=number]{

    width:100%;
    padding:15px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.05);

    color:white;

    font-size:18px;
}

input::placeholder{
    color:#94a3b8;
}

.siffra{
    font-size:70px;
    font-weight:800;
    letter-spacing:-2px;
}

#fragade{
    font-size:100px;
}

button{
    cursor:pointer;

    border:none;

    color:white;

    border-radius:18px;

    font-weight:700;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.96);
}

.plus{
    background:linear-gradient(135deg,#22c55e,#16a34a);
}

.minus{
    background:linear-gradient(135deg,#f59e0b,#ea580c);
}

.reset{
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.spara{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.plusFragade{

    width:220px;
    height:90px;

    font-size:50px;
}

.minusFragade{

    width:120px;
    height:70px;

    font-size:40px;
}

.normalKnapp{
    font-size:28px;
    padding:15px 25px;
}

.liten{
    font-size:18px;
}

.sticky{

    position:sticky;
    top:10px;

    display:flex;
    gap:10px;

    z-index:100;

    margin-bottom:20px;
}

.sticky .box{

    flex:1;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(14px);

    padding:12px;
}

.lbl{
    font-size:12px;
    color:var(--muted);
}

.nr{
    font-size:30px;
    font-weight:800;
}

.full{
    width:90%;
    max-width:600px;
    padding:16px;
    font-size:20px;
}

.gps{
    padding:12px 18px;
    font-size:16px;
}

.runda{

    text-align:left;

    margin-top:10px;

    border-radius:18px;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    padding:15px;
}

.radera{

    background:#dc2626;

    padding:10px 15px;
}

.pop{
    animation:pop .3s ease-out;
}

@keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.18);}
    100%{transform:scale(1);}
}

</style>
</head>

<body>

<div class="sticky">

<div class="box">
<div class="lbl">Frågade</div>
<div id="fragadeBar" class="nr">0</div>
</div>

<div class="box">
<div class="lbl">Signerade</div>
<div id="signeradeBar" class="nr">0</div>
</div>

<div class="box">
<div class="lbl">Konvertering</div>
<div id="konverteringBar" class="nr">0%</div>
</div>

</div>

<h1>📈 Säljdashboard</h1>
<div class="sub">Följ din försäljning i realtid</div>

<div class="card">

<h3>Datum för säljrunda</h3>

<input type="date" id="datum">

</div>

<div class="card">

<h3>Plats</h3>

<input type="text"
id="plats"
placeholder="Ex. Eneby, Norrköping">

<br><br>

<button class="spara gps" onclick="hamtaPlats()">
📍 Hämta GPS-position
</button>

</div>

<div class="card">

<h2>Frågade</h2>

<div id="fragade" class="siffra">0</div>

<button class="minus minusFragade"
onclick="minusFragade()">−</button>

<br><br>

<button class="plus plusFragade"
onclick="plusFragade()">+</button>

<br><br>

<input
type="number"
id="laggTillFragade"
placeholder="Antal personer">

<br><br>

<button
class="plus normalKnapp liten"
onclick="laggTillFragadeAntal()">

Lägg till antal

</button>

</div>

<div class="card">

<h2>Signerade</h2>

<div id="signerade" class="siffra">0</div>

<button
class="minus normalKnapp"
onclick="minusSignerade()">−</button>

<button
class="plus normalKnapp"
onclick="plusSignerade()">+</button>

</div>

<div class="card">

<h2>Konvertering</h2>

<div id="konvertering" class="siffra">0%</div>

</div>

<button
class="spara full"
onclick="sparaRunda()">

💾 Spara säljrunda

</button>

<br><br>

<button
class="spara full"
onclick="exporteraCSV()">

📄 Exportera CSV

</button>

<br><br>

<button
class="reset full"
onclick="aterstall()">

🔄 Återställ aktuell runda

</button>

<div id="historik"></div>

<script>

let fragade=
parseInt(localStorage.getItem("fragade"))||0;

let signerade=
parseInt(localStorage.getItem("signerade"))||0;

let rundor=
JSON.parse(localStorage.getItem("rundor"))||[];

document.getElementById("datum").value=
new Date().toISOString().split("T")[0];

function sparaData(){

localStorage.setItem("fragade",fragade);

localStorage.setItem("signerade",signerade);

}

function beraknaProcent(){

return fragade>0
?
((signerade/fragade)*100).toFixed(1)
:
"0";

}

function uppdatera(){

document.getElementById("fragade").textContent=fragade;
document.getElementById("signerade").textContent=signerade;

document.getElementById("konvertering").textContent=
beraknaProcent()+"%";

document.getElementById("fragadeBar").textContent=fragade;
document.getElementById("signeradeBar").textContent=signerade;

document.getElementById("konverteringBar").textContent=
beraknaProcent()+"%";

sparaData();
}

function hapt(m){

if(navigator.vibrate){

navigator.vibrate(m);

}

}

function pop(id){

[id,id+"Bar"].forEach(x=>{

const el=document.getElementById(x);

if(!el)return;

el.classList.remove("pop");

void el.offsetWidth;

el.classList.add("pop");

});

}

function plusFragade(){

fragade++;

uppdatera();

pop("fragade");

}

function minusFragade(){

if(fragade>0){

fragade--;

uppdatera();

pop("fragade");

}

}

function laggTillFragadeAntal(){

const antal=parseInt(
document.getElementById("laggTillFragade").value
);

if(isNaN(antal)||antal<1){

alert("Ange antal större än 0");

return;

}

fragade+=antal;

document.getElementById("laggTillFragade").value="";

uppdatera();

}

function plusSignerade(){

signerade++;

uppdatera();

pop("signerade");

hapt(30);

}

function minusSignerade(){

if(signerade>0){

signerade--;

uppdatera();

}

}

function sparaRunda(){

rundor.unshift({

datum:
document.getElementById("datum").value,

plats:
document.getElementById("plats").value,

fragade:fragade,

signerade:signerade,

konvertering:beraknaProcent()

});

localStorage.setItem(
"rundor",
JSON.stringify(rundor)
);

fragade=0;
signerade=0;

uppdatera();

visaHistorik();

}

function exporteraCSV(){

if(rundor.length===0){

alert("Inga rundor sparade.");

return;

}

let csv=
"Datum;Plats;Frågade;Signerade;Konvertering\n";

rundor.forEach(r=>{

csv+=

`${r.datum};${r.plats};${r.fragade};${r.signerade};${r.konvertering}\n`;

});

const blob=

new Blob(
["\ufeff"+csv],
{type:"text/csv;charset=utf-8;"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="saljrundor.csv";

a.click();

}

function raderaRunda(i){

if(confirm("Radera säljrunda?")){

rundor.splice(i,1);

localStorage.setItem(
"rundor",
JSON.stringify(rundor)
);

visaHistorik();

}

}

function raderaAllaRundor(){

if(confirm("Radera alla rundor?")){

rundor=[];

localStorage.removeItem("rundor");

visaHistorik();

}

}

function visaHistorik(){

let html=

`
<div class="card">

<h2>Tidigare säljrundor</h2>

<button class="reset full"
onclick="raderaAllaRundor()">

🗑️ Radera alla rundor

</button>
`;

rundor.forEach((r,index)=>{

html+=

`
<div class="runda">

<strong>${r.datum}</strong>

<br>

📍 ${r.plats || "Ej angiven"}

<br><br>

Frågade: ${r.fragade}<br>

Signerade: ${r.signerade}<br>

Konvertering: ${r.konvertering}%<br><br>

<button
class="radera"
onclick="raderaRunda(${index})">

🗑️ Radera

</button>

</div>
`;

});

html+="</div>";

document.getElementById("historik").innerHTML=html;

}

function aterstall(){

if(confirm("Nollställa rundan?")){

fragade=0;

signerade=0;

uppdatera();

}

}

function hamtaPlats(){

if(!navigator.geolocation){

alert("GPS stöds inte.");

return;

}

navigator.geolocation.getCurrentPosition(

function(pos){

document.getElementById("plats").value=

pos.coords.latitude.toFixed(5)+
", "+
pos.coords.longitude.toFixed(5);

},

function(){

alert("Kunde inte hämta position.");

}

);

}

uppdatera();

visaHistorik();

</script>

</body>
</html>
