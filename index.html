<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Säljräknare</title>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#fff;
    margin:0;
    padding:15px;
}

.card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin:15px auto;
    max-width:500px;
}

h1{
    margin-bottom:20px;
}

.siffra{
    font-size:60px;
    font-weight:bold;
    margin:15px 0;
}

#fragade{
    font-size:90px;
}

button{
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.plus{
    background:#22c55e;
    color:white;
}

.minus{
    background:#f59e0b;
    color:white;
}

.spara{
    background:#2563eb;
    color:white;
    width:90%;
    padding:15px;
    font-size:22px;
}

.reset{
    background:#ef4444;
    color:white;
    width:90%;
    padding:15px;
    font-size:22px;
}

.radera{
    background:#dc2626;
    color:white;
    padding:10px;
    font-size:16px;
}

.plusFragade{
    background:#22c55e;
    color:white;
    font-size:40px;
    padding:30px 70px;
    width:100%;
    max-width:200px;
    font-weight:bold;
}

.minusFragade{
    background:#f59e0b;
    color:white;
    font-size:40px;
    padding:20px 35px;
    font-weight:bold;
}

.normalKnapp{
    font-size:30px;
    padding:15px 25px;
}

input[type="date"]{
    width:90%;
    padding:10px;
    font-size:18px;
}

input[type="number"]{
    width:220px;
    padding:15px;
    font-size:22px;
    text-align:center;
    border:1px solid #ccc;
    border-radius:10px;
}

.runda{
    border:1px solid #ccc;
    border-radius:10px;
    background:#f8f8f8;
    padding:10px;
    margin-top:10px;
    text-align:left;
}

</style>
</head>

<body>

<h1>Säljräknare</h1>
<img
    src="IMG_0477.png"
    alt="Säljräknare"
    style="
    width:140px;
    height:140px;
    border-radius:25px;
    margin-bottom:20px;
    ">

<div class="card">
    <h3>Datum för säljrunda</h3>
    <input type="date" id="datum">
</div>

<div class="card">

    <h3>Plats</h3>

    <input
        type="text"
        id="plats"
        placeholder="Ex. Eneby">

    <br><br>

    <button
        class="spara"
        onclick="hamtaPlats()">

        📍 Hämta GPS-position

    </button>

</div>


    
<div class="card">

    <h2>Frågade</h2>

    <div id="fragade" class="siffra">0</div>

    <button class="minusFragade" onclick="minusFragade()">−</button>

    <br><br>

    <button class="plusFragade" onclick="plusFragade()">+</button>

    <br><br>

    <input
        type="number"
        id="laggTillFragade"
        min="1"
        placeholder="Antal personer">

    <br><br>

    <button
        class="plus normalKnapp"
        onclick="laggTillFragadeAntal()">
        Lägg till antal
    </button>

</div>

<div class="card">

    <h2>Signerade</h2>

    <div id="signerade" class="siffra">0</div>

    <button
        class="minus normalKnapp"
        onclick="minusSignerade()">
        −
    </button>

    <button
        class="plus normalKnapp"
        onclick="plusSignerade()">
        +
    </button>

</div>

<div class="card">

    <h2>Konvertering</h2>

    <div id="konvertering" class="siffra">
        0%
    </div>

</div>

<button class="spara" onclick="sparaRunda()">
💾 Spara säljrunda
</button>

<br><br>

<button class="spara" onclick="exporteraCSV()">
📄 Exportera till Excel (CSV)
</button>

<br><br>

<button class="reset" onclick="aterstall()">
🔄 Återställ aktuell runda
</button>

<div id="historik"></div>

<script>

let fragade =
parseInt(localStorage.getItem("fragade")) || 0;

let signerade =
parseInt(localStorage.getItem("signerade")) || 0;

let rundor =
JSON.parse(localStorage.getItem("rundor")) || [];

document.getElementById("datum").value =
new Date().toISOString().split("T")[0];

function sparaData(){

    localStorage.setItem("fragade", fragade);
    localStorage.setItem("signerade", signerade);

}

function uppdatera(){

    document.getElementById("fragade").innerHTML =
    fragade;

    document.getElementById("signerade").innerHTML =
    signerade;

    let procent = 0;

    if(fragade > 0){

        procent =
        ((signerade / fragade) * 100).toFixed(1);

    }

    document.getElementById("konvertering")
    .innerHTML = procent + "%";

    sparaData();

}

function plusFragade(){

    fragade++;
    uppdatera();

}

function minusFragade(){

    if(fragade > 0){

        fragade--;
        uppdatera();

    }

}

function laggTillFragadeAntal(){

    const antal =
    parseInt(
        document.getElementById(
            "laggTillFragade"
        ).value
    );

    if(isNaN(antal) || antal < 1){

        alert("Ange ett antal större än 0.");
        return;

    }

    fragade += antal;

    document.getElementById(
        "laggTillFragade"
    ).value = "";

    uppdatera();

}

function plusSignerade(){

    signerade++;
    uppdatera();

}

function minusSignerade(){

    if(signerade > 0){

        signerade--;
        uppdatera();

    }

}

function sparaRunda(){
    console.log("SparaRunda startar");

const plats =
document.getElementById("plats").value;

    const datum =
    document.getElementById("datum").value;
    
    
    let procent = 0;

    if(fragade > 0){

        procent =
        ((signerade / fragade) * 100).toFixed(1);

        console.log("Runda sparad");
    }

    rundor.unshift({

    datum: datum,
    plats: plats,
    fragade: fragade,
    signerade: signerade,
    konvertering: procent

});



    localStorage.setItem(
        "rundor",
        JSON.stringify(rundor)
    );

    fragade = 0;
    signerade = 0;

    uppdatera();
    visaHistorik();

}

function exporteraCSV(){

    if(rundor.length === 0){

        alert("Inga rundor att exportera.");
        return;

    }

    let csv =
"Datum;Plats;Frågade;Signerade;Konvertering (%)\n";


    rundor.forEach(runda => {

        csv +=
        runda.datum + ";" +
        runda.fragade + ";" +
        runda.signerade + ";" +
        runda.konvertering +
        "\n";

    });

    const blob =
    new Blob(
        [csv],
        {type:"text/csv;charset=utf-8;"}
    );

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(blob);

    link.download =
    "saljrundor.csv";

    link.click();

}

function raderaRunda(index){

    if(confirm("Radera säljrundan?")){

        rundor.splice(index,1);

        localStorage.setItem(
            "rundor",
            JSON.stringify(rundor)
        );

        visaHistorik();

    }

}

function raderaAllaRundor(){

    if(confirm("Radera alla rundor?")){

        rundor = [];

        localStorage.removeItem("rundor");

        visaHistorik();

    }

}

function visaHistorik(){

    let html = `
    <div class="card">

        <h2>Tidigare säljrundor</h2>

        <button
        class="reset"
        onclick="raderaAllaRundor()">

        🗑️ Radera alla rundor

        </button>
    `;

    rundor.forEach((runda,index)=>{

        html += `
        <div class="runda">

          <strong>${runda.datum}</strong>

<br>

📍 ${runda.plats || "Ej angiven"}


            <br><br>

            Frågade: ${runda.fragade}<br>
            Signerade: ${runda.signerade}<br>
            Konvertering: ${runda.konvertering}%<br><br>

            <button
            class="radera"
            onclick="raderaRunda(${index})">

            🗑️ Radera

            </button>

        </div>
        `;
    });

    html += "</div>";

    document.getElementById("historik")
    .innerHTML = html;

}

function aterstall(){

    if(confirm("Nollställa aktuell runda?")){

        fragade = 0;
        signerade = 0;

        uppdatera();

    }

}

uppdatera();
visaHistorik();

 function hamtaPlats(){

    if(!navigator.geolocation){

        alert("GPS stöds inte.");
        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat =
            position.coords.latitude.toFixed(5);

            const lon =
            position.coords.longitude.toFixed(5);

            document.getElementById("plats").value =
            lat + ", " + lon;

        },

        function(){

            alert("Kunde inte hämta position.");

        }

    );

}
   
    
</script>

</body>
</html>
